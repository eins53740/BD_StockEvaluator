version: "3.9"

services:
  api:
    build: .
    container_name: stock-evaluator-api
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me}
    restart: unless-stopped
  test:
    build: .
    image: bd-stockevaluator-test
    container_name: bd-stockevaluator-test
    command: pytest -q
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
    volumes:
      - ./:/app:cached
    tty: false
    stdin_open: false
    restart: "no"
