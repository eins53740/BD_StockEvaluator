version: "3.9"

services:
  api:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    container_name: stock-evaluator-api
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      FLASK_DEBUG: "0"
      DOCKER_RUNTIME: ${DOCKER_RUNTIME:-mock}
    restart: unless-stopped
  test:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: bd-stockevaluator-test
    container_name: bd-stockevaluator-test
    # Install test dependencies at container start then run pytest
    command: /bin/sh -lc "pip install --upgrade pip && pip install -r requirements.test.txt && pytest -q"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DOCKER_RUNTIME: mock
    volumes:
      - ./:/app:cached
    tty: false
    stdin_open: false
    restart: "no"
