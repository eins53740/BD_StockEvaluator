[project]
name = "bd_stockevaluator"
version = "0.1.0"
description = "Stock Evaluator with Flowchart"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpha-vantage>=3.0.0",
    "beautifulsoup4>=4.14.2",
    "cachetools>=6.2.0",
    "colorama>=0.4.6",
    "fastapi>=0.115.0",
    "flask>=3.1.2",
    "forex-python>=1.9.2",
    "fredapi>=0.5.1",
    "fxcmpy>=0.0.0.1",
    "google-genai>=1.42.0",
    "groq>=0.32.0",
    "kaleido>=0.2.1",
    "markdown>=3.9",
    "matplotlib>=3.10.7",
    "metatrader5>=5.0.5328",
    "nltk>=3.9.2",
    "numpy<2.0",
    "numpy-financial>=1.0.0",
    "oandapyv20>=0.7.2",
    "openai>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pandas-datareader>=0.10.0",
    "plotly>=5.24.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.14.5",
    "stocktrends>=0.1.6",
    "ta-lib>=0.6.7",
    "textblob>=0.19.0",
    "uvicorn[standard]>=0.30.0",
    "vadersentiment>=3.3.2",
    "yahoofinancials>=1.20",
    "yfinance>=0.2.66",
    "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "black>=24.10.0",
    "ruff>=0.8.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bd_stockevaluator" = [
    "templates/*.html",
    "static/*",
    "static/charts/*",
]
